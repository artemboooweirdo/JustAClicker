<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Null Tree</title>
    <link rel="stylesheet" href="../styles/nulltree.css" />
  </head>

  <body>
    <p id="nullFragments">ℵ: <span id="nullFragmentsDisplay">0</span></p>
    <button id="backButton" onclick="window.location.href = '../index.html'">
      Back
    </button>
    <div class="container">
      <!-- Null Upgrades -->
      <button class="item" id="null1" type="button">
        <span class="upgrade-name">First Spark</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>
      <button class="item hidden" id="null2" type="button" inert>
        <span class="upgrade-name">Passive Echo</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>
      <button class="item hidden" id="null3" type="button" inert>
        <span class="upgrade-name">Null Yield</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>
      <button class="item hidden" id="null4" type="button" inert>
        <span class="upgrade-name">Click Surge</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>
      <button class="item hidden" id="null5" type="button" inert>
        <span class="upgrade-name">Idle Engine</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>
      <button class="item hidden" id="null6" type="button" inert>
        <span class="upgrade-name">Fragment Core</span>
        <span class="upgrade-cost">Cost: <span data-cost></span> ℵ</span>
        <span class="upgrade-bonus">Bonus: <span data-bonus></span></span>
      </button>

      <!-- Connector lines -->
      <div class="verticalConnector connector1 fromUpgrade1 hidden"></div>
      <div class="horizontalConnector connector2 fromUpgrade2 hidden"></div>
      <div class="verticalConnector connector3 fromUpgrade3 hidden"></div>
      <div class="horizontalConnector connector4 fromUpgrade3 hidden"></div>
      <div class="verticalConnector connector5 fromUpgrade3 hidden"></div>
    </div>
  </body>

  <script src="../scripts/nulltree.js">
    // This is the scripty yay
  </script>

  <!-- for devtools -->
  <script src="https://unpkg.com/eruda"></script>
  <script>
    eruda.init();
  </script>
</html>
