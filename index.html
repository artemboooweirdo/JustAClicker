  <body>
    <!-- Content goes here like a good boy -->
     <h1>Just a Normal Clicker</h1>
     <p>Click the button below to start clicking!</p>
     <Image id="clickerButton" src="clicker.png" alt="Click Me!">

     <p id="cpsContainer">CPS: <span id="cps">0</span></p>

      <button href="nulltree.html">Go to Upgrade Tree</button>
     <!-- Debug information -->

      <nav id="sliding-menu" class="side-menu">
      <button id="menu-close" class="close-btn">×</button>
      <ul>
        <li><a id="bigger-clicks">Bigger Clicks Costs <span id="upgrade1Cost">1</span></a></li>
        <li><a id="badder-clicks">Badder Clicks Cost <span id="upgrade2Cost">100</span></a></li>
        <li><a id="clicker-workers">Clicker Workers Cost <span id="upgrade1CPSCost">1</span></a></li>
        <li><a id="autoclicker">Autoclicker Costs <span id="upgrade2CPSCost">100</span></a></li>
      </ul>
