<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clicker Layout</title>
    <link rel="stylesheet" href="/styles/style.css">

  <body>
    <!-- Content goes here like a good boy -->
     <div class="container">
      <button id="startSong">Start the song</button>
      <button id="stopSong">Stop the song</button>
      <h1>Just a Normal Clicker</h1>
      <p>Click the button!</p>
      <img id="clickerButton" src="assets/images/clicker.png" alt="Click Me!">
      <button id="resetButton">Reset</button>
      <button id="saveData">Save Data</button>
      <button id="nulltree">Null Tree</button>
      <button id="nullify">ℵullify</button>
      <!-- stuff here later -->
     </div>
     

     <span id="clickDisplay">0</span>
     <p id="clicksPerSecondDisplay">CPS: <span id="clicksPerSecond">0</span></p>
     <span id="debugText"></span>
      <p id="nullFragmentsDisplay">ℵ: <span id="nullFragments">0</span></p>




      <!-- TESTING THIS -->

      <!-- Trigger Button -->
      <button id="menu-toggle" class="toggle-btn">Upgrades</button>

      <!-- Sliding Menu Panel -->
      <nav id="sliding-menu" class="side-menu">
      <button id="menu-close" class="close-btn">×</button>
      <ul>
        <li><a id="upgrade1Display">+1 cps <span id="upgrade1Cost">1</span></a></li>
        <li><a id="upgrade2Display">+5 cps <span id="upgrade2Cost">50</span></a></li>
        <li><a id="upgrade3Display">+20 cps <span id="upgrade3Cost">300</span></a></li>
        <li><a id="upgrade4Display">+100 cps <span id="upgrade4Cost">2000</span></a></li>
      </ul>
    </nav>

    <!-- Background Overlay -->
    <div id="menu-overlay" class="overlay"></div>
