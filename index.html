    <title>Clicker Layout</title>

  <body>
    <!-- Content goes here like a good boy -->
    <div class="container">
      <button id="startSong">Start the song</button>
      <button id="stopSong">Stop the song</button>
      <h1 id="gameTitle">Just a Normal Clicker</h1>
      <p id="gameTitleDesc">Click the button!</p>
      <img id="clickerButton" src="assets/images/clicker.png" alt="Click Me!" />
      <button id="resetButton">Reset</button>
      <button id="saveData">Save Data</button>
      <button id="nulltree">Null Tree</button>
      <button id="nullify">ℵullify</button>
      <!-- stuff here later -->
      <nav class="upgradeMenu">
        <ul>
          <li>
            <button id="upgrade1Display" class="upgradePurchase" type="button">
              <span>+1 cps</span>
              <span id="upgrade1Cost">1</span>
            </button>
          </li>
          <li>
            <button id="upgrade2Display" class="upgradePurchase" type="button">
              <span>+5 cps</span>
              <span id="upgrade2Cost">50</span>
            </button>
          </li>
          <li>
            <button id="upgrade3Display" class="upgradePurchase" type="button">
              <span>+20 cps</span>
              <span id="upgrade3Cost">300</span>
            </button>
          </li>
          <li>
            <button id="upgrade4Display" class="upgradePurchase" type="button">
              <span>+100 cps</span>
              <span id="upgrade4Cost">2000</span>
            </button>
          </li>
        </ul>
      </nav>
    </div>

    <span id="clickDisplay">0</span>
    <p id="clicksPerSecondDisplay">CPS: <span id="clicksPerSecond">0</span></p>
    <span id="debugText"></span>
    <p id="nullFragmentsDisplay">ℵ: <span id="nullFragments">0</span></p>

    <span id="alert" class="alert">Data Saved!</span>
